name: Close old pull requests
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  pull-requests: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close pull requests with no activity for 14 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh pr list --repo "$REPO" --state open --limit 500 --json number,updatedAt \
            --jq ".[] | select(.updatedAt < \"$cutoff\") | .number" |
          while read -r n; do
            gh pr close "$n" --repo "$REPO" --comment "Thanks for contributing. Lab pull requests close automatically after 14 days. Your work still counts: the lab check reads closed pull requests too."
          done
